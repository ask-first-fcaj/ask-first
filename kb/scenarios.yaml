- code: N5.3
  group: N5
  title: Mã QR độc hại, bưu phẩm “tri ân” kèm QR, không gắn với bên bị mạo danh cụ thể
  description: >-
    Kẻ gian gửi bưu phẩm “tri ân” chứa mã QR, thao túng tâm lý để người nhận quét mã rồi chiếm đoạt tài sản; nhiều nạn nhân mất tiền và khó trình báo vì kẻ gian xóa dấu vết.
    Bộ Công an cũng nêu mã QR độc hại trong nhóm đánh cắp dữ liệu, chiếm quyền điều khiển thiết bị.
  example_phrases: ["bưu phẩm tri ân"]
  red_flags:
    - Nhận quà hoặc bưu phẩm không đặt kèm mã QR
    - Được hướng dẫn quét mã để xác nhận hoặc nhận hàng
  advice:
    - Không quét mã QR không rõ nguồn gốc, trên bưu phẩm hay tờ rơi
    - Hỏi lại đơn vị bưu chính qua kênh chính thức
  sources:
    - {url: "https://genk.vn/mat-tien-vi-quet-ma-qr-buu-pham-tri-an-nhan-dien-toi-pham-de-phong-ngua-165260926134051255.chn", publisher: "GenK", tier: media}
    - {url: "https://www.bocongan.gov.vn/bai-viet/nang-cao-canh-giac-truoc-25-kich-ban-lua-dao-tren-khong-gian-mang-nam-2026-1788865614", publisher: "Bộ Công an", date: "2026-09-08"}
  verified_at: 2026-10-30

- code: N5.4
  group: N5
  title: Chiếm quyền Zalo hoặc Facebook rồi nhắn người quen vay tiền
  description: >-
    Chỉ với một đường link lạ hoặc một cuộc gọi mạo danh, kẻ gian chiếm tài khoản Zalo rồi nhắn cho người quen để mượn tiền. Một số trường hợp dùng AI giả giọng nói.
    Ca nhắn bằng chữ, không có video deepfake và không mạo danh tổ chức thì thuộc N5.4 theo eval/LABELING.md.
  example_phrases: []
  red_flags:
    - Người quen bỗng nhắn mượn tiền gấp, nói không gọi được
    - Tin đến từ tài khoản người quen nhưng chỉ nhắn chữ, tránh gọi điện
  advice:
    - Gọi lại trực tiếp cho người quen bằng số điện thoại để xác nhận trước khi chuyển tiền
    - Không bấm link lạ, không đọc mã xác thực cho ai
  sources:
    - {url: "https://bocongan.gov.vn/bai-viet/phu-tho-canh-giac-thu-doan-dung-kich-ban-mao-danh-zalo-nguoi-quen-de-lua-dao-1788481818", publisher: "Bộ Công an (Công an tỉnh Phú Thọ)", date: "2026-09-04"}
    - {url: "https://cafef.vn/cong-an-canh-bao-chieu-chiem-quyen-tai-khoan-zalo-ma-nguoi-dan-can-canh-giac-188260521103656632.chn", publisher: "CafeF (dẫn cảnh báo của Công an)", date: "2026-05-22", tier: media}
  verified_at: 2026-10-30

- code: N6
  group: N6
  title: “Hỗ trợ lấy lại tiền bị lừa”, đòi phí trước
  description: >-
    Lợi dụng tâm lý hoang mang và mong lấy lại tiền của người từng bị lừa, kẻ gian giả danh cơ quan chức năng, luật sư, chuyên gia công nghệ hoặc tổ chức hỗ trợ thu hồi tiền,
    gây thiệt hại kép. Chúng tìm bài đăng, video cầu cứu của nạn nhân trên mạng xã hội để chủ động liên hệ, nói đã xác minh được đối tượng lừa đảo,
    đang phong tỏa tài khoản và có thể hỗ trợ lấy lại tiền. Có trang web hoặc fanpage giả Công an (dùng logo, quốc huy, ảnh sĩ quan) hoặc “Công ty Luật Quốc tế…”,
    cam kết “giúp thu hồi tiền bị lừa đảo”.
  example_phrases: ["giúp thu hồi tiền bị lừa đảo"]
  red_flags:
    - Có người chủ động liên hệ khi mình vừa bị lừa, hứa lấy lại tiền
    - Đòi chuyển phí trước để “xử lý hồ sơ”
    - Trang web hoặc fanpage giả Công an, luật sư
  advice:
    - Không trả phí trước cho bất kỳ ai hứa lấy lại tiền
    - Đến trực tiếp cơ quan công an gần nhất để trình báo, và báo ngay cho ngân hàng để chặn giao dịch
  sources:
    - {url: "https://congan.hungyen.gov.vn/canh-bao-thu-doan-lua-dao-ho-tro-lay-lai-tien-bi-lua-dao-tren-khong-gian-mang-c235424.html", publisher: "Công an tỉnh Hưng Yên", date: "2026-04-23"}
    - {url: "https://congan.khanhhoa.gov.vn/vi/thu-doan-gia-mao-trang-cong-an-luat-su-thu-hoi-tien-lua-dao-de-chiem-doat-tai-san", publisher: "Công an tỉnh Khánh Hòa", date: "2025-09-15"}
    - {url: "https://bocongan.gov.vn/bai-viet/canh-giac-voi-thu-doan-ho-tro-lay-lai-tien-bi-lua-dao-1758700973", publisher: "Bộ Công an (Công an tỉnh Lâm Đồng)", date: "2025-09-24"}
  verified_at: 2026-10-30
