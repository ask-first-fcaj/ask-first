# kb/alerts.yaml (AI-29): corpus cảnh báo lừa đảo chính thức cho RAG (ARCH §6.5). Index dựng bằng ai/scripts/build_index.py.
#
# Schema (scripts/validate_kb.py kiểm): `id`; `scenario` theo bảng mã eval/LABELING.md §1 (không dùng N0, OTHER); `title`, `summary`;
# `url` của chính bài viết; `publisher` (cơ quan ra cảnh báo, báo thì ghi "Báo X (dẫn Công an Y)"); `date` là ngày đăng hiện trên trang;
# `tier: media` khi host không thuộc .gov.vn hay kb/allowlist.yaml: báo (kể cả báo ngành công an như congan.com.vn, cand.vn) và
# xaydungchinhsach.chinhphu.vn (chinhphu.vn chưa có trong allowlist); `verified_at`.
#
# Nguồn gốc nội dung (đọc kỹ trước khi tin):
#  - Ngày 2026-11-11 đã mở từng bài trong `url`, đọc thân bài và ngày đăng trên trang. Bài không mở được, không thấy ngày đăng,
#    hoặc báo thương mại không dẫn cảnh báo của cơ quan nhà nước thì không lấy.
#  - `title` và `summary` viết lại bằng lời của team (soạn nháp có AI hỗ trợ, người soạn đọc bài gốc), không chép nguyên văn
#    (ARCH §6.5, tránh vấn đề bản quyền). Chi tiết trong `summary` (số tiền, tên miền giả, tên cơ quan) lấy từ đúng bài đó.
#    Không ghi số điện thoại, số tài khoản, tên nạn nhân. Đã đối chiếu ngẫu nhiên 3 mục với bài gốc; chưa có người thứ hai soát hết.
#  - Mỗi bài chỉ gắn một mã kịch bản (mã chính của bài), dù bài có nhắc thêm chiêu khác.
#  - `summary` là đoạn được embed để tìm kiếm và đưa vào prompt judge (`<canh_bao_lien_quan>`), nên tả cụ thể kẻ gian giả ai,
#    qua kênh nào, dụ gì và đòi làm gì.

- id: A001
  scenario: N1.1
  title: "Giả công an mời lên phường giải trình hồ sơ vụ án rồi chuyển máy cho 'lãnh đạo'"
  summary: >-
    Kẻ gian gọi điện xưng cán bộ công an đang điều tra vụ rửa tiền, buôn lậu, ma túy, nói tên hoặc căn cước của người nghe bị lợi dụng và
    mời lên công an phường "làm thủ tục", "giải trình hồ sơ". Để tăng độ tin, chúng chuyển máy cho người xưng lãnh đạo cấp cao hơn, rồi
    dẫn tới việc khai thông tin, đòi chuyển tiền "kiểm tra tài khoản", cài app lạ, đọc OTP. Nhắm nhiều vào người già, người sống một mình.
  url: "https://congan.ninhbinh.gov.vn/canh-giac-lua-dao-gia-danh-cong-an-goi-nguoi-dan-den-cong-an-phuong-de-lam-thu-tuc-hanh-chinh"
  publisher: "Công an tỉnh Ninh Bình"
  date: "2025-07-03"
  verified_at: 2026-11-11

- id: A002
  scenario: N1.1
  title: "Giả công an, viện kiểm sát gọi điện dọa dính vụ rửa tiền, ma túy để đòi chuyển tiền"
  summary: >-
    Kẻ gian gọi điện bằng số trông giống đầu số cơ quan nhà nước hoặc số quốc tế, xưng là công an, viện kiểm sát hay tòa án, báo người
    nghe dính vào vụ rửa tiền, ma túy, tài khoản bị dùng cho tội phạm. Chúng bắt giữ bí mật với gia đình, rồi đòi chuyển tiền vào "tài
    khoản kiểm tra" để xác minh, gửi giấy triệu tập giả qua email, mạng xã hội kèm mã QR hoặc link, hay bắt cài app giả để chiếm điện
    thoại và lấy OTP.
  url: "https://congan.quangngai.gov.vn/danh-muc-san-pham/-tin-tuc-su-kien/canh-bao-thu-doan-lua-dao-gia-danh-cong-an-dung-chuyen-lien-quan-vu-an-de-chiem-doat-tai-san.html"
  publisher: "Công an tỉnh Quảng Ngãi"
  date: "2025-08-04"
  verified_at: 2026-11-11

- id: A003
  scenario: N1.1
  title: "Công an giả dọa tội ma túy rồi ép học sinh, sinh viên tự cô lập để tống tiền gia đình"
  summary: >-
    Sau một cuộc gọi giả shipper hỏi địa chỉ, kẻ gian xưng công an báo nạn nhân dính đường dây ma túy, rửa tiền. Chúng bắt cài Zoom, bật
    camera, chia sẻ màn hình, chuyển tiền để "chứng minh trong sạch", rồi ép vào nhà nghỉ, cắt liên lạc, đòi mật khẩu Zalo, Facebook và
    nhắn gia đình đòi tiền chuộc. Có lúc chúng gọi video mặc đồ công an, dựng cảnh trụ sở, ép quay clip nhạy cảm để khống chế.
  url: "https://bocongan.gov.vn/bai-viet/canh-bao-bien-tuong-thu-doan-bat-coc-online-1757302259"
  publisher: "Bộ Công an (Công an tỉnh Đồng Nai)"
  date: "2025-09-08"
  verified_at: 2026-11-11

- id: A004
  scenario: N1.1
  title: "Bắt cóc online: giả công an ép thanh niên tự trốn rồi gọi người nhà đòi tiền chuộc"
  summary: >-
    Kẻ gian gọi điện xưng công an, báo nạn nhân là nghi can rửa tiền vì tài khoản có số tiền lớn bất thường, buộc giữ kín và làm việc qua
    Zoom. Chúng đòi chứng minh tài chính bằng cách vay mượn người thân, rồi dàn dựng vụ "tự bắt cóc": bắt nạn nhân đổi chỗ trọ liên tục,
    tự gọi về nhà báo bị bắt cóc. Người nhà, kể cả ông bà, bị dọa bán sang Campuchia nếu không chuyển gấp tiền chuộc.
  url: "https://bocongan.gov.vn/bai-viet/dong-thap-canh-bao-thu-doan-lua-dao-bat-coc-online-nham-vao-gioi-tre-1760686785"
  publisher: "Bộ Công an (Công an tỉnh Đồng Tháp)"
  date: "2025-10-17"
  verified_at: 2026-11-11

- id: A005
  scenario: N1.1
  title: "Gọi video mặc sắc phục, gửi lệnh bắt giả qua Zalo để ép chuyển tiền xác minh"
  summary: >-
    Kẻ gian báo tài khoản của nạn nhân dính đường dây rửa tiền, ma túy quốc tế, bắt kết bạn Zalo, Messenger, gửi lệnh bắt, quyết định khởi
    tố giả có dấu đỏ, ghép ảnh nạn nhân. Rồi chúng gọi video mặc đồ công an, viện kiểm sát, có khi dùng deepfake, nói đây là "vụ án mật",
    bắt khai hết sổ tiết kiệm, chuyển tiền vào "tài khoản xác minh" hoặc cài app chứa mã độc để chiếm điện thoại.
  url: "https://congan.lamdong.gov.vn/canh-giac-voi-chieu-tro-gia-danh-cong-an-qua-video-call--cong-nghe-deepfake-va-mat-canh-giac-dan-den-mat-tien-N2598.aspx"
  publisher: "Công an tỉnh Lâm Đồng (Công an xã Tân Hải)"
  date: "2025-12-11"
  verified_at: 2026-11-11

- id: A006
  scenario: N1.1
  title: "Người xưng công an Hà Nội dọa dính vụ ma túy, đòi chuyển 1,2 tỷ phục vụ điều tra"
  summary: >-
    Một phụ nữ ở Hà Tĩnh nhận cuộc gọi số lạ, người gọi tự xưng cán bộ công an, nói chị liên quan đường dây mua bán ma túy đang được công
    an thành phố khác thụ lý. Hắn bắt khai báo qua điện thoại để "chứng minh vô tội", liên tục đe dọa, rồi yêu cầu chuyển 1,2 tỷ đồng vào
    tài khoản do hắn đưa để "phục vụ điều tra". Ngay cả khi nạn nhân đã ở trụ sở công an, chúng vẫn gọi thúc ép chuyển tiền.
  url: "https://congan.com.vn/vu-an/canh-giac/kip-thoi-ngan-chan-vu-gia-danh-cong-an-goi-dien-hu-doa-lua-dao-12-ty-dong_193369.html"
  publisher: "Báo Công an TP. Hồ Chí Minh (dẫn Công an xã Cẩm Duệ, tỉnh Hà Tĩnh)"
  date: "2026-05-27"
  tier: media
  verified_at: 2026-11-11

- id: A007
  scenario: N1.1
  title: "Giả Phó Viện trưởng Viện kiểm sát báo bị mạo danh mở tài khoản, đòi chuyển tiền"
  summary: >-
    Một người dân ở Hưng Yên nhận cuộc gọi của kẻ tự xưng lãnh đạo Viện kiểm sát nhân dân khu vực ở Hà Nội, báo ông bị kẻ khác dùng thông
    tin để mở tài khoản ngân hàng phục vụ việc phạm pháp. Kẻ gian dọa dẫm, bắt giữ bí mật với người thân, đòi chuyển hơn 45 triệu đồng vào
    tài khoản chúng đưa để "phục vụ điều tra", đồng thời moi thông tin cá nhân và tài khoản ngân hàng.
  url: "https://congan.hungyen.gov.vn/cong-an-xa-le-quy-don-kip-thoi-ngan-chan-vu-gia-danh-can-bo-vien-kiem-sat-de-lua-dao-chiem-doat-tai--c240075.html"
  publisher: "Công an tỉnh Hưng Yên (Công an xã Lê Quý Đôn)"
  date: "2026-09-09"
