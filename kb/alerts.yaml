- id: A102
  scenario: N6
  title: "Giả luật sư hứa thu hồi tiền mất vì sàn vàng ảo để lừa nạn nhân lần hai"
  summary: >-
    Sau khi dụ người dân đầu tư vàng trên sàn ảo qua app và lấy hết tiền, đường dây lừa đảo cho người giả luật sư, chuyên gia tài chính,
    nhân viên hỗ trợ liên hệ nạn nhân, hứa lấy lại nhanh toàn bộ số tiền đã mất. Để tạo lòng tin, chúng đưa ra quy trình có vẻ chuyên
    nghiệp, rồi bắt chuyển trước phí dịch vụ, phí xác minh hoặc khai tài khoản ngân hàng; khi nạn nhân hết tiền thì cắt liên lạc.
  url: "https://cand.vn/canh-giac-thu-doan-lua-dao-lay-lai-tien-da-mat-post825132.html"
