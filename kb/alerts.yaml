- id: A014
  scenario: N1.3
  title: "Giả nhân viên ngân hàng gọi điện, nhắn Zalo hỗ trợ cập nhật sinh trắc học"
  summary: >-
    Kẻ gian xưng là nhân viên ngân hàng, gọi điện, nhắn tin hoặc kết bạn Zalo, Telegram, ngỏ ý giúp cài đặt xác thực sinh trắc học cho
    người ngại ra quầy. Chúng đòi ảnh căn cước, ảnh khuôn mặt, thông tin tài khoản, có khi gọi video để lấy thêm giọng nói, rồi gửi đường
    link bắt tải ứng dụng "hỗ trợ sinh trắc học" và lấy sạch tiền. Ngân hàng không chủ động gọi hướng dẫn việc này; không đưa OTP, mật
    khẩu cho ai.
  url: "https://congan.hungyen.gov.vn/canh-bao-thu-doan-lua-dao-loi-dung-viec-cai-dat-sinh-trac-hoc-c229412.html"
