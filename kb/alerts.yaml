- id: A009
  scenario: N1.2
  title: "Giả nhân viên khoa cấp cứu nhờ công an xã báo người nhà bị tai nạn để đòi viện phí"
  summary: >-
    Kẻ gian xưng nhân viên khoa cấp cứu bệnh viện tỉnh, gọi cho công an xã nhờ báo gia đình rằng người thân bị tai nạn giao thông nặng
    đang được cấp cứu, kèm số điện thoại để liên hệ. Khi gia đình tin và gọi lại, chúng đòi chuyển gấp tiền viện phí vào tài khoản cá nhân
    rồi cắt liên lạc. Biến thể khác là giả giáo viên báo con bị tai nạn. Cấp cứu không bắt đóng viện phí trước qua điện thoại.
  url: "https://conganthanhhoa.gov.vn/phong-chong-toi-pham/thong-bao-tim-chu-so-huu-phuong-tien/canh-bao-toi-pham-gia-danh-nhan-vien-benh-vien-goi-dien-yeu-cau-chuyen-tien-vien-phi-de-chiem-doat.html"
  publisher: "Công an tỉnh Thanh Hóa"
  date: "2024-07-31"
  verified_at: 2026-11-11

- id: A010
  scenario: N1.2
  title: "Giả giáo viên, nhân viên y tế báo học sinh cấp cứu, đòi phụ huynh chuyển tiền mổ"
  summary: >-
    Phụ huynh ở TP. Hồ Chí Minh nhận cuộc gọi của người xưng giáo viên, bạn bè hoặc nhân viên y tế, báo con bị tai nạn nặng đang cấp cứu ở
    một bệnh viện lớn, cần chuyển gấp 30–40 triệu đồng để bác sĩ phẫu thuật. Kẻ gian nắm rõ họ tên và trường học của con nên phụ huynh dễ
    tin. Nhiều người chạy tới viện mới biết con không hề nhập viện. Cần gọi ngay cho trường, bệnh viện để kiểm tra.
  url: "https://vtv.vn/xa-hoi/tai-dien-lua-dao-phu-huynh-chuyen-tien-gap-vi-con-dang-cap-cuu-20241119114720115.htm"
  publisher: "VTV (dẫn Công an TP. Hồ Chí Minh)"
  date: "2024-11-19"
  tier: media
