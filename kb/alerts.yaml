- id: A103
  scenario: N6
  title: "Facebook đội lốt điều tra viên gửi hồ sơ vụ án giả, đòi 10% phí để trả lại tiền"
  summary: >-
    Một phụ nữ ở Quảng Ngãi bị lừa trên trang bán ngọc trai báo trúng thưởng, rồi tìm đến một tài khoản Facebook có ảnh mặc sắc phục công
    an, xưng điều tra viên hứa lấy lại tiền. Kẻ này gửi bộ hồ sơ vụ án mang tên Bộ Công an với con dấu, chữ ký giả, báo số tiền sẽ được
    thu hồi và đòi nộp trước 10% "phí xác minh chính chủ" vào tài khoản cá nhân. Công an không thu phí kiểu này.
  url: "https://congan.quangngai.gov.vn/danh-muc-san-pham/-tin-tuc-su-kien/canh-bao-lua-dao-mo-ngoc-trai-trung-thuong-va-gia-danh-cong-an-ho-tro-thu-hoi-tien.html"
