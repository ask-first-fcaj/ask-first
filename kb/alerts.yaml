- id: A011
  scenario: N1.2
  title: "Cụ bà suýt chuyển hơn 2 tỷ vì cuộc gọi báo con trai bị tai nạn cần mổ gấp"
  summary: >-
    Một cụ bà 76 tuổi ở Hà Tĩnh nhận cuộc gọi báo con trai bị tai nạn giao thông nguy kịch, phải chuyển tiền ngay để phẫu thuật. Kẻ gian
    gọi dồn dập, gây áp lực, khiến bà bán hết số vàng tích góp hơn 2 tỷ đồng và ra ngân hàng chuyển tiền, dù nhân viên nhiều lần can ngăn.
    Ngân hàng báo công an kịp thời ngăn lại. Công an lưu ý chiêu giả người thân gặp nạn nhắm vào tâm lý lo lắng của người già.
  url: "https://bocongan.gov.vn/bai-viet/ngan-chan-kip-thoi-hai-vu-lua-dao-qua-dien-thoai-voi-thu-doan-tinh-vi-1764821336"
  publisher: "Bộ Công an (Công an tỉnh Hà Tĩnh)"
  date: "2025-12-04"
  verified_at: 2026-11-11

- id: A012
  scenario: N1.2
  title: "Giả cán bộ trại giam gọi người nhà phạm nhân đòi tiền lo tại ngoại, viện phí"
  summary: >-
    Kẻ gian dò thông tin người bị tạm giữ, tạm giam qua báo chí, mạng xã hội, rồi gọi điện, nhắn Telegram, Facebook cho người nhà, xưng
    điều tra viên hoặc quản giáo, gửi kèm lý lịch bị can, lệnh tạm giam cắt ghép. Chúng đòi tiền để "lo" cho được tại ngoại, giảm án,
    chuyển buồng, thăm gặp, hoặc bịa chuyện người thân ốm nặng cần đóng viện phí, vi phạm nội quy cần "bảo lãnh", nhận tiền xong thì cắt
    liên lạc.
  url: "https://congan.hungyen.gov.vn/thu-doan-gia-danh-luc-luong-cong-an-lien-he-nguoi-nha-cua-nguoi-bi-tam-giu-nguoi-bi-tam-giam-va-pham-nhan-de-thuc-hien-hanh-vi-lua-dao-chiem-doat-tai-san-c236216.html"
  publisher: "Công an tỉnh Hưng Yên (Trại tạm giam số 2)"
