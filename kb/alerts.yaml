- id: A015
  scenario: N1.3
  title: "Giả ngân hàng báo phí lạ trên thẻ, đòi khoá thẻ hoặc mời mở, nâng cấp thẻ"
  summary: >-
    Đối tượng dùng cuộc gọi VOIP giả đầu số cố định hoặc SIM rác, xưng nhân viên ngân hàng, báo thẻ tín dụng phát sinh khoản phí bất
    thường cần khoá tạm để huỷ, hoặc mời phát hành, nâng cấp thẻ. Nạn nhân được gửi đường link giống trang ngân hàng để đăng nhập, sau đó
    bị lấy thông tin và rút hết tiền. Còn có email giả ngân hàng báo trúng thưởng, hoàn tiền và web giả Ngân hàng Nhà nước phát tán file
    APK độc hại.
