- id: A013
  scenario: N1.2
  title: "Giả cán bộ bệnh viện báo con gái tai nạn nguy kịch, đòi chuyển 100 triệu cấp cứu"
  summary: >-
    Một phụ nữ ở Lào Cai nhận cuộc gọi của kẻ tự xưng cán bộ khoa cấp cứu bệnh viện đa khoa tỉnh, đọc đúng tên, ngày sinh con gái và báo
    cô bị tai nạn giao thông nguy kịch. Hắn đòi chuyển ngay 100 triệu đồng để làm thủ tục nhập viện, cấp cứu, phẫu thuật. Không gọi được
    cho con nên bà rất hoảng, nhưng thấy bất thường đã đến công an xã, được xác nhận đây là chiêu giả nhân viên y tế.
  url: "https://baolaocai.vn/gia-danh-benh-vien-yeu-cau-chuyen-100-trieu-dong-de-cap-cuu-cho-nguoi-than-post905090.html"
