- id: A008
  scenario: N1.1
  title: "Giả công an nhắm vào người cao tuổi: đọc đúng thông tin cá nhân rồi dọa bắt"
  summary: >-
    Kẻ gian gọi cho người già, xưng công an, viện kiểm sát, tòa án hoặc ngân hàng, đọc đúng họ tên, số căn cước, địa chỉ để tạo lòng tin,
    rồi dọa sắp bị bắt, phong tỏa tài khoản, kê biên tài sản. Chúng bắt giấu con cháu, đòi khai tài khoản, mật khẩu, OTP, bấm link, quét
    QR, cài app hoặc chuyển tiền để "xác minh", "chứng minh không liên quan". Công an không bao giờ đòi chuyển tiền qua điện thoại.
  url: "https://congan.khanhhoa.gov.vn/vi/canh-bao-thu-doan-lua-dao-gia-danh-cong-an-nham-den-nguoi-cao-tuoi"
  publisher: "Công an tỉnh Khánh Hòa"
  date: "2026-10-06"
