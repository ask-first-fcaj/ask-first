# kb/checklist.yaml (AI-25): các việc cần làm ngay khi nghi bị lừa, cho lệnh /bilua ("30 phút đầu").
# Plan §3.10 chưa quy định schema cho file này; AI2 đặt theo cùng phong cách các file KB khác, AI1 duyệt lại khi cần.
#
# Quy ước:
#  - KHÔNG ghi số điện thoại ở đây. Bước cần gọi thì dùng `hotline_ref`, số lấy từ kb/hotlines.yaml (chỉ mục đã xác minh).
#  - Phần "bước nào làm trong khung phút nào" (0-5, 5-15, 15-30) là thiết kế của team ở docs/research-concept.md §3.3,
#    CHƯA có nguồn bên ngoài quy định khung phút. Nội dung từng bước nào có nguồn công an thì ghi ở `sources`.
