#    Ngày 2026-10-30 trang chủ trả HTTP 503 nên chưa xác nhận. Nếu không có trong allowlist, SMS giao hàng thật dễ bị báo nhầm.
#  - khonggianmang.vn: không kết nối được từ máy t (HTTP 000). Cẩn thận: có trang giả mạo website này, chỉ lấy link từ trang .gov.vn.
