AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AskFirst Cloud Infrastructure (Dev) - BE-03 SAM skeleton + BE-07 worker

Parameters:
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: >-
      (Tùy chọn) ARN SNS topic nhận alarm DLQ. Để trống thì alarm vẫn có trạng thái ALARM trên CloudWatch
      nhưng không gửi thông báo. Topic gửi email do BE-13 tạo.

  WorkerSnapStart:
    Type: String
    Default: None
    AllowedValues:
      - None
      - PublishedVersions
    Description: >-
      SnapStart cho worker. Mặc định None để có số đo gốc; đổi PublishedVersions để đo lại (docs/decisions/ADR-008).
      Worker luôn có alias live; SQS gắn vào alias này.

  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment stage (dev or prod)

  TelegramBotToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      Token bot cho worker (giai đoạn dev, chưa dùng SSM). Truyền lúc deploy, KHÔNG ghi vào samconfig.toml:
      sam deploy --parameter-overrides Stage=dev TelegramBotToken=<token>

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: java21
    Architectures:
      - x86_64

Resources:
  # ============================================================================
  # 1. LAMBDA WEBHOOK (FUNCTION URL)
  # ============================================================================
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub askfirst-${Stage}-webhook
      Description: Telegram webhook handler with Function URL
      CodeUri: ../backend/ScamProtection/webhook-handler/
      Handler: com.askfirst.webhookhandler.WebhookHandler::handleRequest
      # Handler đọc/ghi DynamoDB và gửi SQS -> cần quyền, nếu không dev sẽ AccessDenied
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AskFirstTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobsQueue.QueueName
        # Đọc SecureString lúc chạy: chỉ tham số telegram/* và chỉ khi giải mã qua SSM
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/askfirst/${Stage}/telegram/*
            - Effect: Allow
              Action: kms:Decrypt
              Resource: '*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      FunctionUrlConfig:
        # Function URL công khai: lớp xác thực duy nhất là header X-Telegram-Bot-Api-Secret-Token
        AuthType: NONE
      Environment:
        Variables:
          STAGE: !Ref Stage
          # Tên biến phải khớp WebhookHandler (thiếu biến nào là Lambda lỗi ngay lúc khởi tạo)
          DYNAMODB_TABLE_NAME: !Ref AskFirstTable
          WEBHOOK_QUEUE_URL: !Ref JobsQueue
          # Token và secret là SecureString: Lambda đọc lúc khởi tạo qua tên tham số, KHÔNG đưa giá trị vào đây
          TELEGRAM_BOT_TOKEN_PARAM: !Sub /askfirst/${Stage}/telegram/bot_token
          TELEGRAM_WEBHOOK_SECRET_PARAM: !Sub /askfirst/${Stage}/telegram/webhook_secret
          POLICY_SHA256: !Sub '{{resolve:ssm:/askfirst/${Stage}/config/policy_sha256}}'

  # ============================================================================
  # 1b. LAMBDA WORKER (SQS jobs: analyze, followup)
  # ============================================================================
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub askfirst-${Stage}-worker
      Description: SQS jobs worker (analyze, followup)
      CodeUri: ../backend/ScamProtection/worker/
      Handler: com.askfirst.worker.WorkerHandler::handleRequest
      # Lambda ai chạy tối đa 90 giây, cộng gửi Telegram: 120 giây. JobsQueue.VisibilityTimeout (720) = 6 lần giá trị này.
      Timeout: 120
      MemorySize: 512
      # Alias live để SnapStart (nếu bật) áp dụng cho version đã publish. Event source SQS tự gắn vào alias.
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: !Ref WorkerSnapStart
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AskFirstTable
        # Worker tự tạo job followup (DelaySeconds=900)
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobsQueue.QueueName
        # Gọi Lambda ai bằng alias live. Tên function theo quy ước askfirst-<stage>-ai: đổi ở đây nếu khác.
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:askfirst-${Stage}-ai:live
      Environment:
        Variables:
          STAGE: !Ref Stage
          # Tên biến khớp WebhookHandler
          DYNAMODB_TABLE_NAME: !Ref AskFirstTable
          WEBHOOK_QUEUE_URL: !Ref JobsQueue
          AI_FUNCTION_ARN: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:askfirst-${Stage}-ai:live
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
      Events:
        JobsQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            BatchSize: 1
            # Message lỗi được báo qua batchItemFailures (WorkerHandler trả SQSBatchResponse)
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5

  # ============================================================================
  # 2. DYNAMODB ASKFIRST (SINGLE-TABLE)
  # ============================================================================
  AskFirstTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub askfirst-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ============================================================================
  # 3. SQS QUEUES (jobs + jobs-dlq)
  # ============================================================================
  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub askfirst-${Stage}-jobs-dlq
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub askfirst-${Stage}-jobs
      VisibilityTimeout: 720 # 6x worker timeout (120s)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 5
      SqsManagedSseEnabled: true

  # Báo khi có job vào DLQ (đã lỗi maxReceiveCount lần). Worker không xóa message ở DLQ nên số message hiển thị
  # đủ để alarm bắn; số liệu SQS trễ vài phút.
  JobsDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub askfirst-${Stage}-jobs-dlq-not-empty
      AlarmDescription: Có job trong DLQ. Xem message, sửa nguyên nhân rồi redrive hoặc xóa.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JobsDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']

  # ============================================================================
  # 4. S3 DATA BUCKET
  # ============================================================================
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub askfirst-${Stage}-data-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDonatedSamplesAfter30Days
            Status: Enabled
            Prefix: donated/
            ExpirationInDays: 30

  # ============================================================================
  # 5. SSM PARAMETER STORE
  # ============================================================================
  StageParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /askfirst/${Stage}/config/stage
      Type: String
      Value: !Ref Stage
      Description: Environment stage

  TableNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /askfirst/${Stage}/dynamodb/table_name
      Type: String
      Value: !Ref AskFirstTable
      Description: DynamoDB single-table name

  JobsQueueUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /askfirst/${Stage}/sqs/jobs_queue_url
      Type: String
      Value: !Ref JobsQueue
      Description: Jobs queue URL

  JobsDlqUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /askfirst/${Stage}/sqs/jobs_dlq_url
      Type: String
      Value: !Ref JobsDeadLetterQueue
      Description: Jobs DLQ URL

  DataBucketNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /askfirst/${Stage}/s3/bucket_name
      Type: String
      Value: !Ref DataBucket
      Description: S3 Data Bucket name

Outputs:
  Stage:
    Description: Environment stage
    Value: !Ref Stage

  WebhookFunctionUrl:
    Description: Function URL for Webhook Lambda (Public HTTP endpoint)
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl

  WebhookFunctionArn:
    Description: Webhook Lambda Function ARN
    Value: !GetAtt WebhookFunction.Arn

  WorkerFunctionArn:
    Description: Worker Lambda Function ARN
    Value: !GetAtt WorkerFunction.Arn

  WorkerRoleArn:
    Description: Role của worker. BE-06 dùng để đặt resource policy của Lambda ai chỉ cho role này gọi
    Value: !GetAtt WorkerFunctionRole.Arn

  JobsDlqAlarmName:
    Description: Tên alarm DLQ
    Value: !Ref JobsDlqAlarm

  DynamoDBTableName:
    Description: DynamoDB Single-Table Name
    Value: !Ref AskFirstTable

  DynamoDBTableArn:
    Description: DynamoDB Table ARN
    Value: !GetAtt AskFirstTable.Arn

  JobsQueueUrl:
    Description: Jobs SQS Queue URL
    Value: !Ref JobsQueue

  JobsQueueArn:
    Description: Jobs SQS Queue ARN
    Value: !GetAtt JobsQueue.Arn

  JobsDlqUrl:
    Description: Jobs Dead-Letter Queue URL
    Value: !Ref JobsDeadLetterQueue

  JobsDlqArn:
    Description: Jobs DLQ ARN
    Value: !GetAtt JobsDeadLetterQueue.Arn

  DataBucketName:
    Description: S3 Data Bucket Name
    Value: !Ref DataBucket

  DataBucketArn:
    Description: S3 Data Bucket ARN
    Value: !GetAtt DataBucket.Arn
