name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
#    timeout-minutes: 25   # test Testcontainers có thể treo nếu container không khởi động
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Có code backend chưa?
        id: has
        shell: bash
        run: |
          if [ -f backend/ScamProtection/mvnw ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dir=backend/ScamProtection" >> "$GITHUB_OUTPUT"
          elif [ -f backend/mvnw ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dir=backend" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend mvnw chưa có, bỏ qua (khung repo)"
          fi
      - uses: actions/setup-java@v4
        if: steps.has.outputs.found == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        if: steps.has.outputs.found == 'true'
        working-directory: ${{ steps.has.outputs.dir }}
        shell: bash
        # Test DynamoDB dùng Testcontainers: chỉ chạy được khi có Docker.
        # Ubuntu runner có sẵn Docker; Windows/macOS runner không có nên test đó được bỏ qua có chủ đích.
        run: ./mvnw -B verify

      # Chặn "pass giả": trên Ubuntu, test DynamoDB PHẢI chạy thật, không được bị skip.
      # Trong project multi-module, báo cáo surefire nằm ở <module>/target/surefire-reports/,
      # nên phải tìm đệ quy từ thư mục backend (không chỉ target/ ở gốc).
      - name: Bắt buộc test DynamoDB chạy thật (không skip)
        if: steps.has.outputs.found == 'true' && matrix.os == 'ubuntu-latest'
        working-directory: ${{ steps.has.outputs.dir }}
        shell: bash
        run: |
          status=0
          for cls in DynamoSpikeTest LaneBRepositoriesTest; do
            reports=$(find . -path '*/surefire-reports/*' -name "TEST-*${cls}.xml")
            if [ -z "$reports" ]; then
              echo "::error::Không có báo cáo surefire cho ${cls} (test có bị bỏ qua cả class không?)"
              status=1
              continue
            fi
            while IFS= read -r r; do
              if ! grep -q 'tests="[1-9]' "$r"; then
                echo "::error::${r}: không có test nào được chạy"; status=1
              fi
              if grep -q 'skipped="[1-9]' "$r"; then
                echo "::error::${r}: có test bị skip, DynamoDB chưa được kiểm chứng thật"; status=1
              fi
              if grep -q 'failures="[1-9]\|errors="[1-9]' "$r"; then
                echo "::error::${r}: có test thất bại"; status=1
              fi
            done <<< "$reports"
            [ $status -eq 0 ] && echo "OK: ${cls} chạy thật"
          done
          exit $status

  ai:
    name: ai (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Có code ai chưa?
        id: has
        shell: bash
        run: |
          if [ -f ai/pyproject.toml ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "::notice::ai/pyproject.toml chưa có, bỏ qua (khung repo)"; fi
      - uses: astral-sh/setup-uv@v5
        if: steps.has.outputs.found == 'true'
      - name: Lint + test
        if: steps.has.outputs.found == 'true'
        working-directory: ai
        shell: bash
        run: |
          uv python install 3.12
          uv sync
          uv run ruff check .
          uv run pytest
      - name: Test eval/ (validator, chấm OCR)
        if: steps.has.outputs.found == 'true'
        working-directory: ai
        shell: bash
        run: uv run --with numpy pytest ../eval
      - name: Kiểm kb/ (test validator và validate dữ liệu)
        if: steps.has.outputs.found == 'true'
        working-directory: ai
        shell: bash
        run: |
          uv run pytest ../scripts
          uv run python ../scripts/validate_kb.py --skip-age

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Có code ai chưa?
        id: has
        shell: bash
        run: |
          if [ -f ai/pyproject.toml ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "::notice::ai/pyproject.toml chưa có, bỏ qua (khung repo)"; fi
      - uses: astral-sh/setup-uv@v5
        if: steps.has.outputs.found == 'true'
      - name: Sinh lại schema và so với contracts/
        if: steps.has.outputs.found == 'true'
        working-directory: ai
        run: |
          uv python install 3.12
          uv sync
          uv run python -m askfirst.domain.export
      - name: Schema không được lệch
        if: steps.has.outputs.found == 'true'
        run: git diff --exit-code contracts/
      - name: Test contract phía Python
        if: steps.has.outputs.found == 'true'
        working-directory: ai
        run: uv run pytest tests/contract

  # Check bắt buộc duy nhất của branch protection: gom kết quả mọi job ở trên.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [backend, ai, contract]
    runs-on: ubuntu-latest
    steps:
      - name: Mọi job phải thành công
        run: |
          echo "backend=${{ needs.backend.result }} ai=${{ needs.ai.result }} contract=${{ needs.contract.result }}"
          test "${{ needs.backend.result }}" = "success" -a "${{ needs.ai.result }}" = "success" -a "${{ needs.contract.result }}" = "success"
